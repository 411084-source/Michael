<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字翻頁卡</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>英文單字翻頁卡</h1>
        <p class="subtitle">點擊卡片翻到背面，查看中文解釋、詞性、例句與字根分析。</p>
        <div class="card-scene" aria-label="Vocabulary flashcard">
            <div class="card" id="vocab-card">
                <div class="card-face card-front" id="card-front">
                    <div class="card-content">
                        <span class="label">English</span>
                        <h2 id="word">loading</h2>
                    </div>
                </div>
                <div class="card-face card-back" id="card-back">
                    <div class="card-content">
                        <span class="label">中文解釋</span>
                        <p id="definition"></p>
                        <div class="detail-row"><strong>詞性：</strong><span id="part-of-speech"></span></div>
                        <div class="detail-row"><strong>例句：</strong><span id="example"></span></div>
                        <div class="detail-row"><strong>字根分析：</strong><span id="root"></span></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="prev-btn">上一張</button>
            <button id="next-btn">下一張</button>
        </div>
        <div class="notes">
            <p>提示：按卡片任一位置即可翻頁。</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
